name: Isolated release verification
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests/unit -v
        working-directory: backend
        env: {PYTHON_DOTENV_DISABLED: '1', PYTHONDONTWRITEBYTECODE: '1'}
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm test && npm run lint && npm run typecheck && npm run build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          WEB_ORIGIN: https://landvilla.in
          BACKEND_ORIGIN: http://api:8000
          BACKEND_TRANSPORT: private-http
  linux-rehearsal:
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python scripts/rehearse-linux-ci.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: disposable-runtime-evidence-${{ github.sha }}
          path: .cache/linux-rehearsal/result.json
          if-no-files-found: warn
          retention-days: 14
