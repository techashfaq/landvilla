# Disposable, loopback-only Linux acceptance environment. Never production credentials.
name: landvilla-rehearsal
x-runtime: &runtime
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: "no"
  stop_grace_period: 40s
  cpus: "1.0"
  mem_limit: 768m
  pids_limit: 128
  networks: [rehearsal]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
x-api-environment: &api-environment
  APP_ENV: production
  DEPLOYMENT_TIER: rehearsal
  PYTHON_DOTENV_DISABLED: "1"
  MONGO_URL: mongodb://mongo:27017/landvilla_rehearsal?replicaSet=lv_rehearsal
  DB_NAME: landvilla_rehearsal
  STORAGE_PROVIDER: cloudflare_r2
  S3_ENDPOINT: http://storage:9000
  S3_BUCKET: landvilla-property-media-rehearsal
  S3_ACCESS_KEY_ID: rehearsal-only
  S3_SECRET_ACCESS_KEY: rehearsal-only-never-production
  S3_REGION: us-east-1
  IDENTITY_ENABLED: "true"
  OTP_HMAC_SECRET: rehearsal-only-public-fixture-not-a-production-secret
  WEB_APP_ORIGINS: https://localhost:8443
  CORS_ORIGINS: https://localhost:8443
  TRUSTED_HOSTS: api,127.0.0.1
  FORWARDED_ALLOW_IPS: ${REHEARSAL_WEB_IP:?Collision-checked reserved Web IPv4 required}
  CLIENT_IP_MODE: signed-v1
  WEB_API_IP_KEY: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
  SEED_ON_STARTUP: "false"
  SEED_DEMO_LISTINGS: "false"
  SEED_TEST_SESSIONS: "false"
  ALLOW_LIVE_PAYMENTS: "false"
  REFUNDS_ENABLED: "false"
  GOOGLE_PLAY_BILLING_ENABLED: "false"
  GOOGLE_CLIENT_IDS: ""
  SMTP_HOST: mail
  SMTP_PORT: "1025"
  SMTP_FROM: rehearsal@example.invalid
  SMTP_USERNAME: rehearsal
  SMTP_PASSWORD: rehearsal-only
  SSL_CERT_FILE: /rehearsal-tls/tls/ca.crt
services:
  mongo:
    <<: *runtime
    image: ${REHEARSAL_MONGO_IMAGE:?Reviewed official Mongo image digest required}
    user: "999:999"
    command: [mongod, --replSet, lv_rehearsal, --bind_ip_all]
    volumes: [mongo_data:/data/db, mongo_config:/data/configdb]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
  storage:
    <<: *runtime
    image: ${REHEARSAL_API_IMAGE:?Exact tested API image required}
    user: "10001:10001"
    init: true
    command: [python, /rehearsal/storage_mock.py]
    environment: {DEPLOYMENT_TIER: rehearsal}
    volumes: [./rehearsal/storage_mock.py:/rehearsal/storage_mock.py:ro]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  mail:
    <<: *runtime
    image: ${REHEARSAL_MAIL_IMAGE:?Reviewed Mailpit image digest required}
    user: "10001:10001"
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: "50"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_QUIET: "true"
      MP_SMTP_AUTH: rehearsal:rehearsal-only
      MP_SMTP_TLS_CERT: /rehearsal-tls/tls/mail.crt
      MP_SMTP_TLS_KEY: /rehearsal-tls/tls/mail.key
      MP_SMTP_REQUIRE_STARTTLS: "1"
    volumes: [mail_tls:/rehearsal-tls:ro]
    depends_on:
      prepare: {condition: service_completed_successfully}
  prepare:
    <<: *runtime
    image: ${REHEARSAL_API_IMAGE:?Exact tested API image required}
    user: "10001:10001"
    environment: *api-environment
    command: [python, /rehearsal/prepare.py]
    # One-shot setup intentionally has no HTTP server; do not inherit API probe.
    healthcheck: {disable: true}
    volumes: [./rehearsal/prepare.py:/rehearsal/prepare.py:ro, mail_tls:/home/app]
    depends_on:
      mongo: {condition: service_healthy}
  api:
    <<: *runtime
    image: ${REHEARSAL_API_IMAGE:?Exact tested API image required}
    user: "10001:10001"
    environment: *api-environment
    volumes: [mail_tls:/rehearsal-tls:ro]
    depends_on:
      prepare: {condition: service_completed_successfully}
      storage: {condition: service_healthy}
      mail: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    <<: *runtime
    image: ${REHEARSAL_WEB_IMAGE:?Exact tested Web image required}
    user: "1000:1000"
    init: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      WEB_ORIGIN: https://localhost:8443
      BACKEND_ORIGIN: http://api:8000
      BACKEND_TRANSPORT: private-http
      CLIENT_IP_MODE: signed-v1
      LANDVILLA_INGRESS_TOKEN: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      WEB_API_IP_KEY: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    networks:
      rehearsal:
        ipv4_address: ${REHEARSAL_WEB_IP:?Collision-checked reserved Web IPv4 required}
    tmpfs: ["/tmp:size=64m,mode=1777", "/app/.next/cache:size=128m,uid=1000,gid=1000,mode=0700"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  caddy:
    <<: *runtime
    image: ${REHEARSAL_CADDY_IMAGE:?Reviewed Caddy 2.11.9 image digest required}
    user: "10001:10001"
    networks: [rehearsal, ingress]
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    environment:
      LANDVILLA_INGRESS_TOKEN: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    ports: [127.0.0.1:8443:8443/tcp]
    volumes: [./Caddyfile.rehearsal:/etc/caddy/Caddyfile:ro]
    # Disposable TLS state belongs only to this rehearsal container. No production volume.
    tmpfs: ["/tmp:size=32m,mode=1777", "/data:size=32m,uid=10001,gid=10001,mode=0700", "/config:size=8m,uid=10001,gid=10001,mode=0700"]
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -T, "2", -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 3s
      retries: 20
networks:
  # Only Caddy joins this bridge so Docker can publish the loopback TLS port.
  # Caddy has ordinary bridge egress; application dependencies remain internal.
  ingress:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${REHEARSAL_INGRESS_SUBNET:?Separate collision-checked private ingress subnet required}
  rehearsal:
    driver: bridge
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${REHEARSAL_SUBNET:?Collision-checked private subnet required}
          ip_range: ${REHEARSAL_DYNAMIC_RANGE:?Dynamic pool excluding Web address required}
volumes:
  mongo_data:
  mongo_config:
  mail_tls:
